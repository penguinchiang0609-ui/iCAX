<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管材 Work 产出检查</title><link rel="icon" href="data:,"><link rel="stylesheet" href="viewer.css?v=consolidated-works-20261119"></head>
<body><header><div><strong>管材 Work 产出检查</strong><span>逐步检查几何、分类、边、刀轴与覆盖</span></div><div id="summary">读取结果…</div></header>
<main><aside class="models"><label class="field">模型<input id="modelSearch" type="search" placeholder="查找模型"></label><div id="modelList" class="scroll list model-list"></div><div id="modelInfo"></div><div class="face-heading"><strong>完整模型 · 原面</strong><button id="clearSelection">取消选中</button></div><input id="faceSearch" type="search" placeholder="面编号或稳定 ID"><div id="faceList" class="scroll list face-list"></div></aside>
<section class="workspace"><div id="workTabs" class="work-tabs" role="tablist" aria-label="Work 阶段" hidden><button role="tab" data-work="import">导入</button><button role="tab" data-work="heal">Heal 修复</button><button role="tab" data-work="align">Align 对齐</button><button role="tab" data-work="contour">Contour 轮廓</button><button role="tab" data-work="classify">Classify 分面</button><button role="tab" data-work="edgeAnalysis">EdgeAnalysis 边分析</button><button role="tab" data-work="pathAnalysis">PathAnalysis 刀轴</button><button role="tab" data-work="faceCutCoverage">FaceCutCoverage 覆盖</button></div><div class="work-banner"><div id="workInfo" class="work-info"></div><label id="workViewControl" hidden>查看<select id="workView"></select></label></div><div class="toolbar"><button id="fit">整件适合窗口</button><button id="fitSelection">查看选中面</button><button id="iso">立体</button><button data-axis="x">沿 X 看</button><button data-axis="y">沿 Y 看</button><button data-axis="z">沿 Z 看</button><label><input id="xray" type="checkbox">透视背面线</label><label>面透明度<input id="opacity" type="range" min="0.08" max="1" step="0.02" value="0.60"></label></div>
<div class="legend"><div id="stageLegend" hidden></div><div id="pathLegend"><label><input id="showPaths" type="checkbox" checked><i class="swatch path"></i>走刀路径 · 绿色实线</label><label><input id="showAxes" type="checkbox" checked><i class="swatch axis"></i>刀轴方向 · 淡黄色箭头</label><label><input id="showSides" type="checkbox" checked><i class="swatch side"></i>侧边 · 红色虚线</label><span style="color:#a1aab8">灰色细线 · 其他加工边；浅灰线 · 边界待建立逻辑关系</span></div><div id="axisLegend"><label>刀轴范围<select id="axisScope"><option value="selection">选中面优先</option><option value="all">整件</option><option value="none">隐藏</option></select></label><label>刀轴长度<input id="axisScale" type="range" min="0.25" max="3" step="0.05" value="1"></label><span id="axisInfo"></span></div><div id="pathLegendNote" class="legend-note">仅皮边生成走刀路径；非皮凸边保留为切透证据，侧边独立记录。与母线平行的皮边保留，刀轴待处理。</div></div>
<section id="sectionPane" class="section-pane" hidden><p id="sectionMessage" role="status" hidden></p><iframe id="sectionFrame" title="截面 Work 产出" hidden></iframe></section>
<div id="viewport"><canvas id="scene" aria-label="完整模型，绿色路径、淡黄色刀轴、红色侧边"></canvas><div id="viewTitle"><strong id="modelName">尚未载入模型</strong><span id="viewSubtitle"></span></div><div id="status" role="status" hidden></div><div id="hover" hidden></div><div class="coordinate-label">模型坐标 · mm</div></div><div class="caption"><span id="selectionCaption">点击原面或边，查看路径、侧边及刀轴依据。</span><span>左键旋转 · 中键/右键拖拽平移 · 滚轮缩放</span></div></section>
<aside id="details" class="details scroll"><p class="empty">选择一个原面或边。</p></aside></main><script type="module" src="viewer.mjs?v=consolidated-works-20261119"></script></body></html>
