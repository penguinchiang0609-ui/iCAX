<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>切割单元 · 几何检查</title><link rel="stylesheet" href="viewer.css"></head>
<body>
<header><div><b>切割单元</b><span class="subtitle">第一步 · 从面组织几何区域</span></div><div class="panel-toggles"><button id="toggleFiles">模型列表</button><button id="toggleDetails">面信息</button></div><div id="total">正在读取结果…</div></header>
<main>
<aside class="left"><div class="examples"><button data-example="18:5">F5 新旧对照</button><button data-example="4:2">F2 碎边合并</button><button data-example="43:1">曲线侧边</button></div><input id="search" placeholder="查找模型名称" aria-label="查找模型名称"><div id="files" class="scroll file-list"></div><div id="caseInfo"></div><div class="face-tools"><input id="faceSearch" placeholder="面编号 F…" aria-label="面编号"><select id="faceFilter" aria-label="筛选面"><option value="all">全部面</option><option value="pending">待处理</option><option value="OpenBand">开口带状</option><option value="ClosedBand">闭合带状</option><option value="UnpairedRegion">未配对区域</option><option value="interior">含内部边</option><option value="comparison">旧版有分片</option></select></div><div id="faces" class="scroll face-list"></div></aside>
<section class="workspace"><div class="toolbar"><div id="layers" class="segmented"><button data-layer="unit">切割单元</button><button data-layer="chain" class="active">边界链</button><button data-layer="group">逻辑边</button><button data-layer="raw">原始碎边</button></div><label><input id="compare" type="checkbox" checked>新旧对照</label></div><div class="toolbar secondary"><button id="overview">单元总览</button><button id="whole">查看整件</button><button id="front">正视选中面</button><button id="fit">适合窗口</button><button id="iso">立体视角</button><label><input id="labels" type="checkbox" checked>编号</label><label><input id="seams" type="checkbox">内部接缝</label><label><input id="profile" type="checkbox">截面轮廓</label></div>
<section id="unitLegend" hidden><div class="overview-title"><b>完整模型 · 按单元着色</b><div id="wholeDownloads"></div></div><div id="unitLegendRows" class="scroll"></div></section><div class="boundary-legend"><span><i class="skin-line"></i>皮上：粗实线</span><span><i class="side-line"></i>侧边：虚线</span><span><i class="internal-line"></i>内部：普通实线</span><span><i class="pending-line"></i>未决</span></div><div id="viewports"><div class="view" id="newView"><canvas id="newCanvas" aria-label="当前切割单元三维模型"></canvas><div class="view-heading"><b id="newHeading">当前结果</b><span id="newSubtitle"></span></div><div id="labelOverlay"></div><div class="axis">模型坐标 · mm</div></div><div class="view" id="oldView"><canvas id="oldCanvas" aria-label="旧版分片三维模型"></canvas><div class="view-heading old"><b id="oldHeading">历史分片</b><span>仅用于比较，视角同步</span></div><div id="oldMessage"></div><div class="axis">历史结果 · 同一原始面</div></div></div>
<div id="caption"></div><div class="hint">左键拖动旋转 · 右键拖动平移 · 滚轮缩放 · 点击模型或编号查看归属</div></section>
<aside class="right scroll" id="details"></aside>
</main><div id="loading"><div><div class="spinner"></div><b id="loadingText">正在读取模型…</b></div></div><script type="module" src="viewer.js"></script></body></html>
